# Anel de integração dos quality gates (ADR-0015).
#
# Custo: R$ 0 — repositório público tem GitHub Actions gratuito e ilimitado
# (ADR-0010). Nenhum serviço externo, nenhuma conta paga.
# As actions são fixadas em versão EXATA, não em tag major móvel (@v7). Duas
# razões: coerência com o resto do repositório (o compose fixa a tag da imagem,
# o pre-commit fixa o `rev`), e porque `astral-sh/setup-uv` sequer publica tag
# major acima de v7 — `@v10` não resolve, como o primeiro run deste workflow
# provou.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela execuções antigas da mesma branch: push seguido não paga duas vezes
# em fila e o resultado que importa é sempre o do último commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff, mypy, pytest, contratos)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Instala o uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Instala as dependências
        # `--frozen` recusa resolver: se o uv.lock não bate com o
        # pyproject.toml, o job falha em vez de instalar outra coisa. É o
        # equivalente do `dotnet restore --locked-mode`.
        run: uv sync --frozen

      - name: ruff format (verifica, não reescreve)
        run: uv run ruff format --check src tests

      - name: ruff check
        run: uv run ruff check src tests

      - name: mypy --strict
        run: uv run mypy

      - name: contratos de arquitetura (ADR-0012)
        run: uv run lint-imports

      - name: pytest + cobertura global
        run: uv run pytest --cov --cov-fail-under=80

      - name: cobertura do núcleo (domain + application)
        # Segundo anel (ADR-0015): a lógica pura é barata de testar e cara de
        # errar. Reaproveita o .coverage do passo anterior.
        run: uv run coverage report --include="*/domain/*,*/application/*" --fail-under=90

  openapi:
    name: contrato OpenAPI e tipos TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --frozen
        working-directory: backend

      - name: Gera o schema OpenAPI
        # A chave é um valor descartável só para o boot passar: `create_app()`
        # recusa subir sem ANTHROPIC_API_KEY (ADR-0013), e gerar o schema exige
        # instanciar a aplicação. Nenhuma chamada de rede acontece aqui —
        # nenhum segredo de verdade é necessário no CI.
        env:
          ANTHROPIC_API_KEY: ci-nao-e-uma-chave-real
        working-directory: backend
        run: |
          uv run python -c "
          import json, pathlib
          from voicecoach.api.app import create_app
          schema = create_app().openapi()
          pathlib.Path('openapi.json').write_text(json.dumps(schema, indent=2) + '\n')
          print('paths:', sorted(schema['paths']))
          "

      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Gera os tipos TypeScript do contrato
        run: |
          pnpm --filter @voicecoach/api-client install --frozen-lockfile
          pnpm --filter @voicecoach/api-client run generate

      - name: O contrato commitado tem de estar em dia
        # **É este passo que faz o ADR-0008 item 4 valer alguma coisa.** Gerar os
        # tipos e jogá-los fora provaria só que o gerador roda. Comparando com o
        # que está no repositório, uma mudança de contrato vira DIFF REVISÁVEL no
        # PR — e esquecer de regenerar vira build vermelho, em vez de um erro de
        # runtime no aparelho de alguém.
        run: |
          git diff --exit-code --stat -- backend/openapi.json packages/api-client/src/schema.d.ts \
            || {
              echo "::error::O OpenAPI ou os tipos TS estão desatualizados."
              echo "Rode, da raiz:  (cd backend && uv run python -c \"...\") && pnpm --filter @voicecoach/api-client run generate"
              git diff -- backend/openapi.json packages/api-client/src/schema.d.ts
              exit 1
            }

      - name: Publica o schema como artefato
        uses: actions/upload-artifact@v7.0.1
        with:
          name: openapi-schema
          path: backend/openapi.json

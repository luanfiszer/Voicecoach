# Regras do gitleaks (ADR-0015).
#
# Por que este arquivo existe: as regras default do gitleaks v8 reconhecem
# GitHub PAT, tokens do Slack, chaves da AWS e dezenas de outros formatos — mas
# NÃO reconhecem a chave da Anthropic. E, pelo ADR-0010, a `ANTHROPIC_API_KEY`
# é o único segredo real deste projeto. Sem a regra abaixo, o hook de segredo
# ficaria verde justamente no caso que importa.
#
# Verificado empiricamente no CARD-003: uma chave `sk-ant-...` colada num
# arquivo .py passou pelo gitleaks default sem uma linha de aviso.

[extend]
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Chave de API da Anthropic (sk-ant-...)"
# Cobre as variantes de console (api) e de administração (admin), presentes e
# futuras: o sufixo numérico da versão fica genérico de propósito.
regex = '''sk-ant-(?:api|admin|sid)[0-9]{2}-[A-Za-z0-9_\-]{32,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "anthropic-api-key-generico"
description = "Qualquer coisa com cara de chave da Anthropic"
# Rede mais larga, para o caso de a Anthropic mudar o prefixo de versão.
regex = '''sk-ant-[A-Za-z0-9_\-]{24,}'''
keywords = ["sk-ant-"]

[allowlist]
description = "Falsos positivos conhecidos"
paths = [
    # O .env.example é versionado de propósito e tem a variável VAZIA.
    '''\.env\.example$''',
]

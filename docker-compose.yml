# Infraestrutura de desenvolvimento local do Voicecoach.
#
# Custo zero por requisito (ADR-0010): tudo roda na máquina, nenhum serviço
# gerenciado. Tags fixadas por versão exata — `:16` ou `:latest` fazem a
# imagem mudar debaixo do projeto sem ninguém pedir.
#
#   docker compose up -d                              # postgres + redis + minio
#   docker compose --profile observability up -d      # + jaeger
#   docker compose --profile app up -d --build        # + migrate, storage-setup,
#                                                     #   api e worker em container
#
# As portas de host são configuráveis (${X_PORT}) porque 5432/6379 costumam já
# estar ocupadas por instalações locais — é o risco que o CARD-002 antecipou.
name: voicecoach

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voicecoach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voicecoach}
      POSTGRES_DB: ${POSTGRES_DB:-voicecoach}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready é o probe oficial do Postgres: responde só quando o servidor
      # aceita conexão, não quando o processo nasceu.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voicecoach} -d ${POSTGRES_DB:-voicecoach}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4.10-alpine
    # appendonly no + snapshot raro: em dev o Redis guarda idempotência, quota e
    # fila (ADR-0005). Perder isso num restart é aceitável; pagar fsync não é.
    command: ["redis-server", "--appendonly", "no", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # `pgsty/minio`, fork comunitário com tag de versão fixável (ADR-0072): a
    # MinIO fechou o Docker Hub em 2026-09 (ADR-0062) e o quay.io em 2026-10.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-voicecoach}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-voicecoach-dev-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # A imagem do MinIO não traz curl; traz o `mc`. `mc ready local` é o probe
      # que a própria MinIO documenta.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # O bucket precisa existir antes do primeiro `put_object` — sem ele, o adapter
  # de storage falha com `NoSuchBucket` (CARD-008). Criá-lo aqui, e não no boot
  # da aplicação, é decisão de permissão: em S3 real a credencial do produto
  # deve poder ler e escrever objetos e NADA além disso. Criar bucket é
  # administração, e administração não é papel da aplicação.
  #
  # Roda uma vez e sai (`restart: "no"`); `mc mb --ignore-existing` é idempotente,
  # então subir o compose de novo não quebra nada. Reusa a MESMA imagem do
  # servidor MinIO — ela já traz o `mc` (o healthcheck acima o usa) e a tag já
  # está fixada, o que evita mais uma imagem para manter atualizada.
  createbuckets:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-voicecoach}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-voicecoach-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-voicecoach-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        echo "bucket pronto: $$S3_BUCKET"
    restart: "no"

  # --- profile `app`: API e worker em container (CARD-024, ADR-0076) ---------
  #
  # Profile, e não default: no Mac o caminho de desenvolvimento continua sendo
  # API e worker no HOST (o worker com `mlx`, que o container não tem — ADR-0027).
  # Subir os dois juntos faria dois workers disputarem a mesma fila. Este
  # profile é o ensaio do deploy (CARD-055): o mesmo que o servidor vai rodar.
  #
  # Segredos vêm do `.env` da raiz (`env_file`); o `environment` só troca o que
  # muda DENTRO da rede do compose — os hosts. `environment` ganha de `env_file`.
  migrate:
    profiles: ["app"]
    build: { context: backend, target: api }
    image: voicecoach-api:dev
    env_file: .env
    environment: &rede-interna
      DATABASE_URL: postgresql+asyncpg://voicecoach:voicecoach@postgres:5432/voicecoach
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      # Quem baixa o áudio é o leitor, fora da rede do compose (ADR-0045).
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # As regras de retenção do bucket (CARD-017, ADR-0075). Sem elas o worker
  # não sobe — por isso o worker depende deste passo ter terminado bem.
  storage-setup:
    profiles: ["app"]
    image: voicecoach-worker:dev
    build: { context: backend, target: worker }
    env_file: .env
    environment: *rede-interna
    command: ["voicecoach-storage-setup"]
    depends_on:
      createbuckets: { condition: service_completed_successfully }
    restart: "no"

  api:
    profiles: ["app"]
    image: voicecoach-api:dev
    env_file: .env
    environment: *rede-interna
    ports:
      - "${API_CONTAINER_PORT:-8001}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      # Liveness, não readiness: o `ready` depende do worker, e um container
      # "unhealthy" enquanto o worker carrega modelo seria mentira sobre a API.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    profiles: ["app"]
    image: voicecoach-worker:dev
    env_file: .env
    environment:
      <<: *rede-interna
      # O `.env` de dev pode dizer `auto`/`mlx`; no container só existe este.
      STT_PROVIDER: faster_whisper
      TTS_VOICES_DIR: /app/voices
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-setup: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  jaeger:
    # Jaeger v2 — a imagem all-in-one do v1 foi substituída por esta.
    image: jaegertracing/jaeger:2.20.0
    # Profile opcional (ADR-0010, item 6): sobe só quando se está estudando
    # traces. Nenhum código exporta spans ainda — a instrumentação OTel vem com
    # a observabilidade (visão §D), não com este card.
    profiles: ["observability"]
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"   # UI
      - "${OTLP_GRPC_PORT:-4317}:4317"     # OTLP gRPC
      - "${OTLP_HTTP_PORT:-4318}:4318"     # OTLP HTTP

# Volumes nomeados: o dado sobrevive a `docker compose down`; some só com
# `down -v`. Bind mount para dentro do repo seria pior — sujaria o git e
# amarraria permissão de arquivo do host ao container.
volumes:
  postgres-data:
  redis-data:
  minio-data:

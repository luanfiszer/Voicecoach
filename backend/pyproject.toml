[project]
name = "voicecoach"
version = "0.1.0"
description = "Backend do Voicecoach — professor de inglês por conversa de áudio."
requires-python = ">=3.12"

# Cada card traz apenas as dependências que ele realmente usa (SQLAlchemy no de
# persistência, arq no de fila, anthropic no de IA). As do CARD-002 entram para
# o health check e para servir a aplicação:
#   uvicorn  — servidor ASGI; sem ele não existe "a API sobe"
#   asyncpg  — driver async do Postgres (o mesmo dialeto que o CARD-005 usará)
#   redis    — cliente async oficial (redis-py); PING do readiness
#   httpx    — probe HTTP do MinIO e client dos testes de API
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.30",
    "redis>=5.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # Quality gates do CARD-003 (ADR-0015):
    #   ruff        — lint + format numa ferramenta só (≈ analyzers + dotnet format)
    #   mypy        — tipagem estática estrita (≈ nullable enable + warning-as-error)
    #   pytest-cov  — cobertura; plugin do coverage.py
    #   pre-commit  — orquestra os hooks de git (o anel local do gate)
    "ruff>=0.14",
    "mypy>=1.13",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
]

# pytest: `asyncio_mode = "auto"` dispensa decorar cada teste async com
# @pytest.mark.asyncio.
#
# `--strict-markers` faz marker não registrado virar erro em vez de aviso — sem
# isso, um `@pytest.mark.slwo` (com typo) é silenciosamente ignorado e o teste
# roda quando não devia.
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"

# ---------------------------------------------------------------------------
# ruff — lint e format (ADR-0015)
#
# Substitui black + flake8 + isort. O que se perde: plugins de flake8 sem
# equivalente portado. O que se ganha: uma config, uma ferramenta, ~50ms no
# repositório inteiro.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88          # o default do ruff e do black; o formatter cuida sozinho
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Conjunto curado: além dos erros, as famílias que corrigem *idioma* — o valor
# pedagógico é o ponto (CLAUDE.md: o produto é o conhecimento do desenvolvedor).
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes — o que o compilador pegaria
    "I",        # isort — ordem dos imports
    "N",        # pep8-naming
    "UP",       # pyupgrade — escreve no idioma da versão do Python alvo
    "B",        # flake8-bugbear — armadilhas reais (mutable default, etc.)
    "BLE",      # blind except — `except Exception` tem que ser justificado
    "C4",       # comprehensions
    "SIM",      # simplify
    "PT",       # pytest style
    "ANN",      # anotação de tipo obrigatória na assinatura
    "RUF",      # regras do próprio ruff
]

[tool.ruff.lint.per-file-ignores]
# Testes podem ter funções longas de arranjo; o que importa é a asserção.
"tests/**" = ["ANN401"]

# ---------------------------------------------------------------------------
# mypy — modo estrito (ADR-0015)
#
# `strict = true` liga de uma vez ~12 flags, entre elas:
#   disallow_untyped_defs      — função sem anotação é erro
#   disallow_any_generics      — `list` pelado é erro; tem que ser `list[str]`
#   warn_return_any            — devolver Any de função tipada é erro
#   warn_unused_ignores        — `# type: ignore` que não silencia nada é erro
# Equivalente mental: <Nullable>enable</Nullable> + TreatWarningsAsErrors.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
# Mostra o código do erro (ex.: [union-attr]) para o `# type: ignore[...]` poder
# ser específico em vez de um silenciador genérico.
show_error_codes = true

[[tool.mypy.overrides]]
# asyncpg não publica `py.typed`: não distribui suas anotações, então o mypy não
# tem o que ler e reclama do import. Override pontual e documentado — a
# alternativa (afrouxar o modo global) trocaria um erro conhecido por cegueira
# em todo o resto. Gatilho para remover: asyncpg passar a publicar py.typed.
module = ["asyncpg.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# coverage — dois anéis (ADR-0015)
#   1. global, travado no valor real de hoje: qualquer regressão quebra
#   2. núcleo (domain + application), mais exigente: é a lógica barata de
#      testar e cara de errar. Hoje passa vazio; morde a partir do CARD-005.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["voicecoach"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",       # bloco que só existe para o type checker
    "raise NotImplementedError",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicecoach"]

# ---------------------------------------------------------------------------
# Contratos de arquitetura — a regra de camada que o README declara em prosa,
# aqui em forma executável (`uv run lint-imports`).
#
# Python não tem a barreira que o C# tem: lá, Domain.csproj simplesmente não
# referencia Infrastructure.csproj e o compilador impede o acoplamento. Aqui
# qualquer módulo importa qualquer módulo, então o contrato precisa ser um lint.
# Equivalente mental: NetArchTest/ArchUnitNET rodando no build.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["voicecoach"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Camadas apontam para dentro (domain não conhece ninguém)"
type = "layers"
layers = [
    "api | worker",
    "adapters",
    "application",
    "domain",
]
containers = ["voicecoach"]

# Regra de manutenção (ADR-0012): dependência nova que não pode vazar para
# dentro entra nestas listas NO MESMO COMMIT que a adiciona. Lista desatualizada
# é gate que não morde.
[[tool.importlinter.contracts]]
name = "domain é puro: sem framework, sem SDK, sem IO"
type = "forbidden"
source_modules = ["voicecoach.domain"]
forbidden_modules = [
    "fastapi",
    "pydantic",
    "pydantic_settings",
    "uvicorn",
    "asyncpg",
    "redis",
    "httpx",
]

[[tool.importlinter.contracts]]
name = "application não conhece framework nem SDK de provider"
type = "forbidden"
source_modules = ["voicecoach.application"]
forbidden_modules = [
    "fastapi",
    "pydantic_settings",
    "uvicorn",
    "asyncpg",
    "redis",
    "httpx",
]

# `voicecoach.config` mora fora das cinco camadas (ADR-0013), então o contrato
# de `layers` acima não diz nada sobre ele — sem este contrato, `domain` poderia
# importá-lo e o lint passaria. Configuração é composição: só api, worker e
# adapters a leem; domain e application recebem valores por parâmetro.
[[tool.importlinter.contracts]]
name = "configuração é composição: domain e application não leem config"
type = "forbidden"
source_modules = [
    "voicecoach.domain",
    "voicecoach.application",
]
forbidden_modules = ["voicecoach.config"]

[project]
name = "voicecoach"
version = "0.1.0"
description = "Backend do Voicecoach — professor de inglês por conversa de áudio."
requires-python = ">=3.12"

# Cada card traz apenas as dependências que ele realmente usa (SQLAlchemy no de
# persistência, arq no de fila, anthropic no de IA). As do CARD-002 entram para
# o health check e para servir a aplicação:
#   uvicorn  — servidor ASGI; sem ele não existe "a API sobe"
#   asyncpg  — driver async do Postgres (o mesmo dialeto que o CARD-005 usará)
#   redis    — cliente async oficial (redis-py); PING do readiness
#   httpx    — probe HTTP do MinIO e client dos testes de API
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.30",
    "redis>=5.0",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    # CARD-006 (ADR-0027 / ADR-0029):
    #   faster-whisper — STT local em CPU (CTranslate2). É o default em x86 e o
    #                    ÚNICO caminho que o CI consegue exercitar. Traz o PyAV,
    #                    que é quem decodifica AAC/Opus sem `ffmpeg` no PATH.
    #   numpy          — o áudio decodificado é um ndarray. Usado por nome nas
    #                    anotações dos adapters, então declarado por nome.
    "faster-whisper>=1.0",
    "numpy>=2.0",
]

# `mlx-whisper` é dependência OPCIONAL, não base (ADR-0027, item 4): ela só
# existe em Apple Silicon. Instalar com `uv sync --extra mlx`; o marker impede
# que uma máquina x86 sequer tente resolvê-la.
#
# Equivalente mental .NET: um pacote referenciado dentro de uma `Condition` de
# RID no .csproj — presente no build de arm64-osx, ausente nos demais.
[project.optional-dependencies]
mlx = [
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # Quality gates do CARD-003 (ADR-0015):
    #   ruff        — lint + format numa ferramenta só (≈ analyzers + dotnet format)
    #   mypy        — tipagem estática estrita (≈ nullable enable + warning-as-error)
    #   pytest-cov  — cobertura; plugin do coverage.py
    #   pre-commit  — orquestra os hooks de git (o anel local do gate)
    "ruff>=0.14",
    "mypy>=1.13",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    "testcontainers[postgres]>=4.8",
]

# pytest: `asyncio_mode = "auto"` dispensa decorar cada teste async com
# @pytest.mark.asyncio.
#
# `--strict-markers` faz marker não registrado virar erro em vez de aviso — sem
# isso, um `@pytest.mark.slwo` (com typo) é silenciosamente ignorado e o teste
# roda quando não devia.
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `-m "not slow"` DESELECIONA por padrão os testes que carregam modelo de IA de
# verdade: eles baixam pesos na primeira execução (36-99 s medidos) e o caminho
# `mlx` nem existe no CI. Para rodá-los à mão: `uv run pytest -m slow`.
addopts = "--strict-markers --strict-config -m 'not slow'"
markers = [
    "slow: toca modelo de IA real; deselecionado por padrão (ver addopts)",
]

# ---------------------------------------------------------------------------
# ruff — lint e format (ADR-0015)
#
# Substitui black + flake8 + isort. O que se perde: plugins de flake8 sem
# equivalente portado. O que se ganha: uma config, uma ferramenta, ~50ms no
# repositório inteiro.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88          # o default do ruff e do black; o formatter cuida sozinho
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Conjunto curado: além dos erros, as famílias que corrigem *idioma* — o valor
# pedagógico é o ponto (CLAUDE.md: o produto é o conhecimento do desenvolvedor).
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes — o que o compilador pegaria
    "I",        # isort — ordem dos imports
    "N",        # pep8-naming
    "UP",       # pyupgrade — escreve no idioma da versão do Python alvo
    "B",        # flake8-bugbear — armadilhas reais (mutable default, etc.)
    "BLE",      # blind except — `except Exception` tem que ser justificado
    "C4",       # comprehensions
    "SIM",      # simplify
    "PT",       # pytest style
    "ANN",      # anotação de tipo obrigatória na assinatura
    "RUF",      # regras do próprio ruff
]

[tool.ruff.lint.per-file-ignores]
# Testes podem ter funções longas de arranjo; o que importa é a asserção.
"tests/**" = ["ANN401"]

# ---------------------------------------------------------------------------
# mypy — modo estrito (ADR-0015)
#
# `strict = true` liga de uma vez ~12 flags, entre elas:
#   disallow_untyped_defs      — função sem anotação é erro
#   disallow_any_generics      — `list` pelado é erro; tem que ser `list[str]`
#   warn_return_any            — devolver Any de função tipada é erro
#   warn_unused_ignores        — `# type: ignore` que não silencia nada é erro
# Equivalente mental: <Nullable>enable</Nullable> + TreatWarningsAsErrors.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
# Mostra o código do erro (ex.: [union-attr]) para o `# type: ignore[...]` poder
# ser específico em vez de um silenciador genérico.
show_error_codes = true

[[tool.mypy.overrides]]
# asyncpg não publica `py.typed`: não distribui suas anotações, então o mypy não
# tem o que ler e reclama do import. Override pontual e documentado — a
# alternativa (afrouxar o modo global) trocaria um erro conhecido por cegueira
# em todo o resto. Gatilho para remover: asyncpg passar a publicar py.typed.
module = ["asyncpg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Mesmo caso do asyncpg, agora nas bibliotecas de STT (CARD-006):
#
#   faster_whisper — verificado: o wheel NÃO contém `py.typed`, então o mypy
#                    trata o pacote como sem anotações e o import vira erro.
#                    Gatilho para remover: faster-whisper passar a publicar
#                    py.typed.
#   mlx_whisper    — além de não publicar py.typed, é EXTRA OPCIONAL: numa
#                    máquina x86 o pacote nem está instalado, e sem este
#                    override o `mypy` do CI falharia num import que, lá, é
#                    legitimamente inexistente. Gatilho para remover: o dia em
#                    que publicar py.typed E deixar de ser Apple-only.
#
# Override PONTUAL por módulo, nunca afrouxamento do `strict` global: a
# alternativa trocaria dois erros conhecidos por cegueira em todo o resto.
module = ["faster_whisper.*", "mlx_whisper.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# coverage — dois anéis (ADR-0015)
#   1. global, travado no valor real de hoje: qualquer regressão quebra
#   2. núcleo (domain + application), mais exigente: é a lógica barata de
#      testar e cara de errar. Hoje passa vazio; morde a partir do CARD-005.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["voicecoach"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",       # bloco que só existe para o type checker
    "raise NotImplementedError",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicecoach"]

# ---------------------------------------------------------------------------
# Contratos de arquitetura — a regra de camada que o README declara em prosa,
# aqui em forma executável (`uv run lint-imports`).
#
# Python não tem a barreira que o C# tem: lá, Domain.csproj simplesmente não
# referencia Infrastructure.csproj e o compilador impede o acoplamento. Aqui
# qualquer módulo importa qualquer módulo, então o contrato precisa ser um lint.
# Equivalente mental: NetArchTest/ArchUnitNET rodando no build.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["voicecoach"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Camadas apontam para dentro (domain não conhece ninguém)"
type = "layers"
layers = [
    "api | worker",
    "adapters",
    "application",
    "domain",
]
containers = ["voicecoach"]

# Regra de manutenção (ADR-0012): dependência nova que não pode vazar para
# dentro entra nestas listas NO MESMO COMMIT que a adiciona. Lista desatualizada
# é gate que não morde.
[[tool.importlinter.contracts]]
name = "domain é puro: sem framework, sem SDK, sem IO"
type = "forbidden"
source_modules = ["voicecoach.domain"]
forbidden_modules = [
    "fastapi",
    "pydantic",
    "pydantic_settings",
    "uvicorn",
    "asyncpg",
    "redis",
    "httpx",
    # SQLAlchemy/Alembic entram no CARD-005 (ADR-0004): persistência é detalhe
    # de adapter e não pode vazar para o núcleo. Adicionados à lista no MESMO
    # commit que trouxe a dependência — foi a omissão exata que o CARD-004
    # encontrou com o pydantic.
    "sqlalchemy",
    "alembic",
    # STT entra no CARD-006 (ADR-0027/0029). `numpy` e `av` estão aqui junto das
    # bibliotecas de IA porque são o vazamento mais fácil de cometer sem querer:
    # o áudio decodificado é um ndarray, e bastaria anotá-lo numa assinatura de
    # porta para o núcleo passar a depender de numpy.
    "faster_whisper",
    "mlx_whisper",
    "numpy",
    "av",
]

[[tool.importlinter.contracts]]
name = "application não conhece framework nem SDK de provider"
type = "forbidden"
source_modules = ["voicecoach.application"]
forbidden_modules = [
    "fastapi",
    # pydantic é contrato de API, não modelo de caso de uso (ADR-0008): só a
    # borda `api/` o usa. Faltava aqui — descoberto no CARD-004 provando que o
    # gate morde: `from pydantic import BaseModel` em application passava verde.
    "pydantic",
    "pydantic_settings",
    "uvicorn",
    "asyncpg",
    "redis",
    "httpx",
    # Idem para application: o caso de uso orquestra portas, nunca uma sessão
    # de banco (ADR-0004 + ADR-0012).
    "sqlalchemy",
    "alembic",
    # A porta `SpeechToText` mora aqui e é exatamente onde a biblioteca de STT
    # tentaria vazar. `numpy` é o caso não-óbvio: sem ele nesta lista, tipar a
    # porta como `transcribe(audio: NDArray[np.float32])` passaria verde e
    # amarraria a aplicação ao formato interno do adapter (ADR-0029).
    "faster_whisper",
    "mlx_whisper",
    "numpy",
    "av",
]

# `voicecoach.config` mora fora das cinco camadas (ADR-0013), então o contrato
# de `layers` acima não diz nada sobre ele — sem este contrato, `domain` poderia
# importá-lo e o lint passaria. Configuração é composição: só api, worker e
# adapters a leem; domain e application recebem valores por parâmetro.
[[tool.importlinter.contracts]]
name = "configuração é composição: domain e application não leem config"
type = "forbidden"
source_modules = [
    "voicecoach.domain",
    "voicecoach.application",
]
forbidden_modules = ["voicecoach.config"]
